name: Daily Job Opportunities Update

on:
  schedule:
    # 08:00 UTC = 11:00 AM Saudi Arabia
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Search and update job opportunities
        run: python update_jobs.py

      - name: Commit updated jobs
        run: |
          git config user.name "job-opportunities-bot"
          git config user.email "actions@github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No new job opportunities"
          else
            git commit -m "Daily automatic job opportunities update"
            git push
          fi
